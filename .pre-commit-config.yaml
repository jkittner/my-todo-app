# Install once with `pre-commit install` (after `npm install`). Hooks for both stages are set up.
# Run everything by hand: `pre-commit run --all-files` (add `--hook-stage pre-push` for the tests).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # File hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^examples/

  # Validates the GitHub Actions workflows against their schema.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows

  # Project tools, run from node_modules so versions match package.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, css, html, json, yaml, markdown]
      - id: typecheck
        name: typecheck (tsc)
        entry: npm run typecheck --silent
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: unit-tests
        name: unit tests (vitest)
        entry: npm test --silent
        language: system
        files: ^(src|tests|e2e/generate\.ts)/?
        pass_filenames: false
        stages: [pre-push]
